version: "3.8"

services:
  agent-worker:
    image: wgi/edge-cpu-agent:latest
    container_name: wgi-auh-gov-api-01-service
    environment:
      - WGI_BRANCH=AUH-GOV
      - WGI_SUB_BRANCH=API-01
      - WGI_ROLE=Governmental Activation
      - WGI_AGENT_COUNT=10000
      - NODE_ENV=production
    restart: always
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
    command: python3 agent_worker.py --branch AUH --sub API-01
