version: "3.8"

services:
  agent-worker:
    image: wgi/edge-cpu-agent:latest
    container_name: wgi-sel-mob-pusan-03-service
    volumes:
      - .:/app
      - ./data:/data
    environment:
      - WGI_BRANCH=SEL-MOB
      - WGI_SUB_BRANCH=PUSAN-03
      - WGI_ROLE=Video -> Text
      - WGI_AGENT_COUNT=6000
      - NODE_ENV=production
    restart: always
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
    command: python3 agent_worker.py --branch SEL --sub PUSAN-03
