version: "3.8"

services:
  agent-worker:
    image: wgi/edge-cpu-agent:latest
    container_name: wgi-zrh-sec-priv-02-service
    environment:
      - WGI_BRANCH=ZRH-SEC
      - WGI_SUB_BRANCH=PRIV-02
      - WGI_ROLE=Regulatory Firewall
      - WGI_AGENT_COUNT=15000
      - NODE_ENV=production
    restart: always
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
    command: python3 agent_worker.py --branch ZRH --sub PRIV-02
