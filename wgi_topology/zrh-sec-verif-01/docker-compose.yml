version: "3.8"

services:
  agent-worker:
    image: wgi/edge-cpu-agent:latest
    container_name: wgi-zrh-sec-verif-01-service
    environment:
      - WGI_BRANCH=ZRH-SEC
      - WGI_SUB_BRANCH=VERIF-01
      - WGI_ROLE=Zero-Trust Verification
      - WGI_AGENT_COUNT=15000
      - NODE_ENV=production
    restart: always
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
    command: python3 agent_worker.py --branch ZRH --sub VERIF-01
