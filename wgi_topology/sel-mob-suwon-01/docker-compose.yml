version: "3.8"

services:
  agent-worker:
    image: wgi/edge-cpu-agent:latest
    container_name: wgi-sel-mob-suwon-01-service
    environment:
      - WGI_BRANCH=SEL-MOB
      - WGI_SUB_BRANCH=SUWON-01
      - WGI_ROLE=Patrol & Delivery Robotics
      - WGI_AGENT_COUNT=7000
      - NODE_ENV=production
    restart: always
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
    command: python3 agent_worker.py --branch SEL --sub SUWON-01
