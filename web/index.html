<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>ARK OMEGA Monitor</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #020617; color: #f8fafc; font-family: sans-serif; }
        .neon-border { border: 1px solid rgba(6, 182, 212, 0.4); box-shadow: 0 0 15px rgba(6, 182, 212, 0.15); }
    </style>
</head>
<body class="p-8">
    <h1 class="text-3xl font-bold text-cyan-400 mb-6">ARK OMEGA - TELEMETRY</h1>
    <div id="status-grid" class="grid grid-cols-1 md:grid-cols-3 gap-6">
        <div class="p-6 bg-slate-900 rounded-xl neon-border">
            <h2 class="text-slate-400 text-sm">System Pulse</h2>
            <div class="text-2xl font-bold text-green-400">ACTIVE</div>
        </div>
    </div>
    <div class="mt-12 bg-slate-950 p-6 rounded-lg border border-slate-800">
        <h2 class="text-indigo-400 font-bold mb-4">Command Stream</h2>
        <div id="logs" class="font-mono text-xs text-slate-500 h-64 overflow-y-auto">
            >> Connected to Multi-Level Bridge...
        </div>
    </div>
</body>
</html>
